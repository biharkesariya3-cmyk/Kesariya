<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Cars | CARS 24*7</title><meta name="description" content="Compare up to three cars side by side."><link rel="canonical" href="#"><meta property="og:title" content="Compare Cars | CARS 24*7"><link rel="stylesheet" href="css/styles.css"></head><body><main><section class="page-hero"><div class="container"><h1>Compare Cars</h1><p>Compare up to three vehicles side by side. Best-value figures are highlighted.</p></div></section><section class="container compare-wrap"><div class="saved-actions"><select id="add-compare"><option value="">Add vehicle</option></select><button class="btn" onclick="addCompare(+document.querySelector('#add-compare').value)">Add Vehicle</button></div><div id="compare-root"></div></section></main><script src="js/cars.js"></script><script src="js/app.js"></script><script src="js/compare.js"></script><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('#add-compare').innerHTML='<option value="">Add vehicle</option>'+vehicles.map(v=>`<option value="${v.id}">${v.year} ${v.make} ${v.model}</option>`).join(''))</script></body></html>
