<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Dealers | CARS 24*7</title><meta name="description" content="Find trusted dealers near you and browse their vehicle inventory."><link rel="canonical" href="#"><meta property="og:title" content="Find Dealers | CARS 24*7"><link rel="stylesheet" href="css/styles.css"></head><body><main><section class="page-hero"><div class="container"><h1>Find Trusted Dealers Near You</h1><p>Connect with highly rated dealers and explore their current inventory.</p></div></section><section class="section"><div class="container"><form class="search-panel search-fields" onsubmit="event.preventDefault();toast('Showing dealers near your ZIP code.')"><div class="field"><label>ZIP code</label><input required placeholder="e.g. 75001"></div><div class="field"><label>Distance</label><select><option>25 miles</option><option>50 miles</option><option>100 miles</option></select></div><button class="btn">Find Dealers</button></form><div class="dealer-grid" style="margin-top:25px" id="dealers-grid"></div></div></section></main><script src="js/cars.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let d=[...new Map(vehicles.map(v=>[v.dealer,v])).values()].slice(0,9);document.querySelector('#dealers-grid').innerHTML=d.map((v,i)=>`<article class="dealer-card"><span class="deal-badge good-deal">VERIFIED PARTNER</span><h2>${v.dealer}</h2><p>${v.location}<br><b class="rating">★ ${v.dealerRating}</b> · ${40+i*18} reviews<br>${8+i*12} vehicles in inventory</p><p class="small">Mon–Sat 9:00 AM – 7:00 PM<br>(555) 01${i}-24${i}</p><div class="vehicle-actions"><a class="btn secondary" href="cars.html?make=${v.make}">View Inventory</a><button class="btn outline" onclick="openContact(${v.id})">Contact Dealer</button></div></article>`).join('')})</script></body></html>
