<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cars for Sale | CARS 24*7</title><meta name="description" content="Search new, used and certified cars for sale with filters, prices and deal insights."><link rel="canonical" href="#"><meta property="og:title" content="Cars for Sale | CARS 24*7"><link rel="stylesheet" href="css/styles.css"></head><body><main><section class="page-hero"><div class="container"><h1>Cars for Sale</h1><p>Search new, used, and certified vehicles from dealers across the United States.</p></div></section><div class="container listing-layout"><aside class="filters" id="filters"><div class="filter"><label class="filter-title" for="q">Search inventory</label><input id="q" name="q" placeholder="Make, model, body style"></div><div class="filter"><span class="filter-title">Condition</span><select name="condition"><option value="">Any condition</option><option>New</option><option>Used</option><option>Certified</option></select></div><div class="filter"><span class="filter-title">Make & model</span><select name="make"><option value="">All makes</option><option>Toyota</option><option>Honda</option><option>Ford</option><option>Chevrolet</option><option>Tesla</option><option>BMW</option><option>Mercedes-Benz</option><option>Jeep</option><option>Nissan</option><option>Hyundai</option><option>Kia</option><option>Subaru</option></select><input name="model" placeholder="Model" style="margin-top:7px"></div><div class="filter"><span class="filter-title">Price</span><div class="range-row"><input name="minPrice" type="number" placeholder="Min"><input name="maxPrice" type="number" placeholder="Max"></div></div><div class="filter"><span class="filter-title">Mileage</span><input name="maxMileage" type="number" placeholder="Maximum miles"></div><div class="filter"><span class="filter-title">Body style</span><select name="bodyStyle"><option value="">All body styles</option><option>SUV
